<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Teachers</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="admin-teachers">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand"><img class="brand-logo" src="../images/logo-white.svg" alt="" /><span>Admin</span></div><button class="btn btn-secondary" type="button" data-mobile-menu>☰</button></div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="students.html">Students</a>
          <a class="active" href="teachers.html">Teachers</a>
          <a href="classes.html">Classes</a>
          <a href="subjects.html">Subjects</a>
          <a href="cbt.html">CBT</a>
          <a href="academic-results.html">Academic Results</a>
          <a href="activities.html">Activities</a>
          <a href="settings.html">Settings</a>
          <a href="../index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>
      <main class="main-panel">
        <header class="topbar"><h1 class="page-title">Teachers</h1><div class="topbar-actions"><span class="user-chip">Admin</span><button class="btn btn-secondary" type="button" onclick="logout()">Logout</button></div></header>
        <div class="content">
          <section class="card">
            <div class="card-header"><h3>Add Teacher</h3></div>
            <form id="addTeacherForm" class="form-grid">
              <div><label>Full Name</label><input id="teacherName" type="text" required /></div>
              <div><label>Teacher Unique ID</label><input id="teacherId" type="text" required /></div>
              <div><label>Password</label><input id="teacherPassword" type="password" value="123456" /></div>
              <div><label for="teacherClass">Assigned Class</label><select id="teacherClass" required></select></div>
              <div><span class="small-label">Assigned Subjects</span><div id="teacherSubjectOptions" class="assignment-options"></div></div>
              <div><label>Status</label><select id="teacherStatus"><option>Active</option><option>Inactive</option></select></div>
              <div><label for="teacherPhoto">Teacher photo</label><input id="teacherPhoto" type="file" accept="image/*" /></div>
              <div style="grid-column: 1 / -1;"><button class="btn btn-primary" type="submit">Add Teacher</button></div>
            </form>
          </section>

          <section class="table-card" style="margin-top: 1rem;">
            <div class="card-header"><h3>Teacher Records</h3></div>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Photo</th><th>Teacher ID</th><th>Full Name</th><th>Subject</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="adminTeachersTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="modal" id="editTeacherModal" role="dialog" aria-modal="true" aria-labelledby="editTeacherTitle">
      <div class="modal-box">
        <h3 id="editTeacherTitle">Edit Teacher</h3>
        <form id="editTeacherForm" class="form-grid">
          <div><label for="editTeacherName">Full Name</label><input id="editTeacherName" type="text" required /></div>
          <div><span class="small-label">Assigned Subjects</span><div id="editTeacherSubjectOptions" class="assignment-options"></div></div>
          <div style="grid-column: 1 / -1;"><label for="editTeacherClasses">Assigned Classes</label><input id="editTeacherClasses" type="text" required /></div>
          <div class="modal-actions" style="grid-column: 1 / -1;">
            <button class="btn btn-secondary" id="cancelTeacherEdit" type="button">Cancel</button>
            <button class="btn btn-primary" type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-sync.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
