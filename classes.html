<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Classes</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="admin-classes">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand"><img class="brand-logo" src="../images/logo-white.svg" alt="" /><span>Admin</span></div><button class="btn btn-secondary" type="button" data-mobile-menu>☰</button></div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="students.html">Students</a>
          <a href="teachers.html">Teachers</a>
          <a class="active" href="classes.html">Classes</a>
          <a href="subjects.html">Subjects</a>
          <a href="cbt.html">CBT</a>
          <a href="academic-results.html">Academic Results</a>
          <a href="activities.html">Activities</a>
          <a href="settings.html">Settings</a>
          <a href="../index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>
      <main class="main-panel">
        <header class="topbar"><h1 class="page-title">Classes</h1><div class="topbar-actions"><span class="user-chip">Admin</span><button class="btn btn-secondary" type="button" onclick="logout()">Logout</button></div></header>
        <div class="content">
          <section class="card">
            <div class="card-header"><h3>Add Class</h3></div>
            <form id="addClassForm" class="form-grid">
              <div><label>Class Name</label><input id="className" type="text" placeholder="e.g. SS 3" required /></div>
              <div style="align-self: end;"><button class="btn btn-primary" type="submit">Add Class</button></div>
            </form>
          </section>

          <section class="table-card" style="margin-top: 1rem;">
            <div class="card-header"><h3>Class List</h3></div>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Class</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="adminClassesTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-sync.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
