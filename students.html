<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Students</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="teacher-students">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand"><img class="brand-logo" src="../images/logo-white.svg" alt="" /><span>Teacher</span></div>
          <button class="btn btn-secondary" type="button" data-mobile-menu>☰</button>
        </div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a class="active" href="students.html">My students</a>
          <a href="subjects.html">My Subjects</a>
          <a href="enter-scores.html">Enter Scores</a>
          <a href="results.html">Academic Results</a>
          <a href="cbt-questions.html">CBT Questions</a>
          <a href="activities.html">Activities</a>
          <a href="../index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1 class="page-title">Students</h1>
          <div class="topbar-actions">
            <span class="user-chip">Teacher</span>
            <button class="btn btn-secondary" type="button" onclick="logout()">Logout</button>
          </div>
        </header>

        <div class="content">
          <section class="table-card">
            <div class="card-header">
              <h3>Assigned Students</h3>
            </div>
            <div class="filter-bar">
              <div class="filter-group">
                <label for="teacherStudentSearch">Search</label>
                <input id="teacherStudentSearch" type="text" placeholder="Search student or ID" />
              </div>
              <div class="filter-group">
                <label for="teacherClassFilter">Class</label>
                <select id="teacherClassFilter">
                  <option value="">All</option>
                </select>
              </div>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Photo</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Date of birth</th>
                    <th>Class</th>
                    <th>Session</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="teacherStudentsTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-sync.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
