<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Results</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="teacher-results">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand"><img class="brand-logo" src="../images/logo-white.svg" alt="" /><span>Teacher</span></div>
          <button class="btn btn-secondary" type="button" data-mobile-menu>☰</button>
        </div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="students.html">My Classes</a>
          <a href="subjects.html">My Subjects</a>
          <a href="students.html">Students</a>
          <a href="enter-scores.html">Enter Scores</a>
          <a class="active" href="results.html">Academic Results</a>
          <a href="cbt-questions.html">CBT Questions</a>
          <a href="activities.html">Activities</a>
          <a href="../index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1 class="page-title">Results</h1>
          <div class="topbar-actions">
            <span class="user-chip">Teacher</span>
            <button class="btn btn-secondary" type="button" onclick="logout()">Logout</button>
          </div>
        </header>

        <div class="content">
          <section class="table-card">
            <div class="filter-bar">
              <div class="filter-group"><label for="resultClassFilter">Class</label><select id="resultClassFilter"></select></div>
              <div class="filter-group"><label for="resultTermFilter">Term</label><select id="resultTermFilter"></select></div>
              <div class="filter-group"><label for="resultSessionFilter">Session</label><select id="resultSessionFilter"></select></div>
              <button class="btn btn-secondary" id="downloadTeacherResults" type="button">Download CSV</button>
              <button class="btn btn-secondary" id="printTeacherResults" type="button">Print</button>
            </div>
            <div class="table-wrapper">
              <table>
                <thead id="resultsTableHead"></thead>
                <tbody id="resultsTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-sync.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
