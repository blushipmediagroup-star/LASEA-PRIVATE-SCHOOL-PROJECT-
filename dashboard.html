<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="teacher-dashboard">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand"><img class="brand-logo" src="../images/logo-white.svg" alt="" /><span>Teacher</span></div>
          <button class="btn btn-secondary" type="button" data-mobile-menu>☰</button>
        </div>
        <nav>
          <a class="active" href="dashboard.html">Dashboard</a>
          <a href="subjects.html">My Subjects</a>
          <a href="students.html">My Students</a>
          <a href="enter-scores.html">Enter Scores</a>
          <a href="results.html">Academic Results</a>
          <a href="cbt-questions.html">CBT Questions</a>
          <a href="activities.html">Activities</a>
          <a href="../index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1 class="page-title">Teacher Portal</h1>
          <div class="topbar-actions">
            <img id="teacherDashboardPhoto" class="teacher-dashboard-photo" alt="" hidden />
            <span class="school-name-label" data-school-name>School Name</span>
            <span class="user-chip" id="teacherWelcome">Teacher</span>
            <button class="btn btn-secondary" type="button" onclick="logout()">Logout</button>
          </div>
        </header>

        <div class="content">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="small-label">My Subjects</div>
              <h3 id="teacherSubjectCount">0</h3>
            </div>
            <div class="stat-card">
              <div class="small-label">Students</div>
              <h3 id="teacherStudentCount">0</h3>
            </div>
            <div class="stat-card">
              <div class="small-label">CBT Tests</div>
              <h3 id="teacherCbtCount">0</h3>
            </div>
          </div>

          <div class="card-grid">
            <section class="card">
              <div class="card-header">
                <h3>My Subjects</h3>
              </div>
              <ul id="teacherSubjectList" class="list"></ul>
            </section>
          </div>

          <section class="card">
            <div class="card-header">
              <h3>Recent Activity</h3>
            </div>
            <ul id="teacherActivityList" class="list"></ul>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-sync.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
